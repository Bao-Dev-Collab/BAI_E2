<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="560" viewBox="0 0 1440 560" role="img" aria-labelledby="title desc">
  <title id="title">Luồng xử lý ảnh qua VGG16 và DenseNet121</title>
  <desc id="desc">Hai mô hình nhận ảnh 224 nhân 224, trích xuất đặc trưng bằng backbone pretrained ImageNet, sau đó classifier dự đoán một trong 37 giống chó mèo.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f4f8ff"/>
      <stop offset="1" stop-color="#eef7f4"/>
    </linearGradient>
    <linearGradient id="blue" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3157c8"/>
      <stop offset="1" stop-color="#5279e4"/>
    </linearGradient>
    <linearGradient id="green" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#087e70"/>
      <stop offset="1" stop-color="#1ca58c"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-15%" width="120%" height="140%">
      <feDropShadow dx="0" dy="7" stdDeviation="9" flood-color="#17345b" flood-opacity=".10"/>
    </filter>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M1 1 L11 6 L1 11 Z" fill="#91a2ba"/>
    </marker>
  </defs>
  <rect width="1440" height="560" rx="28" fill="url(#bg)"/>
  <circle cx="1330" cy="45" r="115" fill="#dce8ff" opacity=".42"/>
  <circle cx="90" cy="510" r="120" fill="#d9f3eb" opacity=".55"/>
  <text x="64" y="58" fill="#152744" font-family="Segoe UI, Arial, sans-serif" font-size="30" font-weight="700">Hai backbone, cùng một bài toán 37 lớp</text>
  <text x="64" y="91" fill="#61718a" font-family="Segoe UI, Arial, sans-serif" font-size="17">Ảnh được chuyển thành đặc trưng, rồi classifier mới dự đoán giống thú cưng.</text>

  <rect x="42" y="122" width="1356" height="174" rx="22" fill="#ffffff" opacity=".82"/>
  <rect x="42" y="314" width="1356" height="174" rx="22" fill="#ffffff" opacity=".82"/>

  <rect x="62" y="145" width="150" height="126" rx="18" fill="#f3f6fb" stroke="#d8e1ee"/>
  <rect x="82" y="162" width="110" height="66" rx="12" fill="#dce9f8"/>
  <circle cx="138" cy="190" r="19" fill="#c89164"/>
  <path d="M121 177 L113 162 L132 170 M155 170 L174 162 L166 180" fill="#8c5a3d" stroke="#8c5a3d" stroke-width="5" stroke-linejoin="round"/>
  <circle cx="131" cy="190" r="2.8" fill="#28364d"/>
  <circle cx="146" cy="190" r="2.8" fill="#28364d"/>
  <path d="M134 200 Q139 204 144 200" fill="none" stroke="#68442f" stroke-width="2.5" stroke-linecap="round"/>
  <text x="137" y="249" text-anchor="middle" fill="#263954" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="700">Ảnh đầu vào</text>
  <text x="137" y="268" text-anchor="middle" fill="#738198" font-family="Segoe UI, Arial, sans-serif" font-size="13">224 × 224</text>

  <line x1="220" y1="208" x2="294" y2="208" stroke="#91a2ba" stroke-width="3" marker-end="url(#arrow)"/>
  <rect x="308" y="145" width="415" height="126" rx="18" fill="url(#blue)" filter="url(#shadow)"/>
  <text x="340" y="182" fill="#dce6ff" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="700" letter-spacing="1.2">BACKBONE PRETRAINED</text>
  <text x="340" y="220" fill="#ffffff" font-family="Segoe UI, Arial, sans-serif" font-size="28" font-weight="700">VGG16</text>
  <text x="340" y="247" fill="#edf1ff" font-family="Segoe UI, Arial, sans-serif" font-size="16">Tích chập theo các tầng tuần tự</text>
  <g transform="translate(630 174)">
    <rect x="0" y="0" width="18" height="52" rx="5" fill="#ffffff" opacity=".42"/>
    <rect x="25" y="8" width="18" height="44" rx="5" fill="#ffffff" opacity=".62"/>
    <rect x="50" y="16" width="18" height="36" rx="5" fill="#ffffff" opacity=".82"/>
  </g>
  <line x1="731" y1="208" x2="790" y2="208" stroke="#91a2ba" stroke-width="3" marker-end="url(#arrow)"/>
  <rect x="804" y="145" width="230" height="126" rx="18" fill="#ffffff" stroke="#d8e1ee" filter="url(#shadow)"/>
  <text x="919" y="187" text-anchor="middle" fill="#263954" font-family="Segoe UI, Arial, sans-serif" font-size="18" font-weight="700">Classifier mới</text>
  <text x="919" y="218" text-anchor="middle" fill="#66758c" font-family="Segoe UI, Arial, sans-serif" font-size="15">Linear → 37 logits</text>
  <text x="919" y="244" text-anchor="middle" fill="#66758c" font-family="Segoe UI, Arial, sans-serif" font-size="13">Chỉ lớp cuối được train</text>
  <line x1="1042" y1="208" x2="1090" y2="208" stroke="#91a2ba" stroke-width="3" marker-end="url(#arrow)"/>
  <rect x="1104" y="145" width="268" height="126" rx="18" fill="#eef2ff" stroke="#d7defb"/>
  <text x="1238" y="187" text-anchor="middle" fill="#263954" font-family="Segoe UI, Arial, sans-serif" font-size="18" font-weight="700">Dự đoán</text>
  <text x="1238" y="220" text-anchor="middle" fill="#435fc0" font-family="Segoe UI, Arial, sans-serif" font-size="20" font-weight="700">1 trong 37 giống</text>
  <text x="1238" y="245" text-anchor="middle" fill="#66758c" font-family="Segoe UI, Arial, sans-serif" font-size="13">ví dụ: Persian, Beagle…</text>

  <rect x="62" y="337" width="150" height="126" rx="18" fill="#f3f6fb" stroke="#d8e1ee"/>
  <rect x="82" y="354" width="110" height="66" rx="12" fill="#e1f3ee"/>
  <circle cx="138" cy="382" r="19" fill="#bd8a61"/>
  <path d="M122 370 L118 350 L135 362 M154 362 L171 350 L166 372" fill="#83543d" stroke="#83543d" stroke-width="5" stroke-linejoin="round"/>
  <circle cx="131" cy="382" r="2.8" fill="#28364d"/>
  <circle cx="146" cy="382" r="2.8" fill="#28364d"/>
  <path d="M134 392 Q139 396 144 392" fill="none" stroke="#68442f" stroke-width="2.5" stroke-linecap="round"/>
  <text x="137" y="441" text-anchor="middle" fill="#263954" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="700">Ảnh đầu vào</text>
  <text x="137" y="460" text-anchor="middle" fill="#738198" font-family="Segoe UI, Arial, sans-serif" font-size="13">224 × 224</text>

  <line x1="220" y1="400" x2="294" y2="400" stroke="#91a2ba" stroke-width="3" marker-end="url(#arrow)"/>
  <rect x="308" y="337" width="415" height="126" rx="18" fill="url(#green)" filter="url(#shadow)"/>
  <text x="340" y="374" fill="#d8fff4" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="700" letter-spacing="1.2">BACKBONE PRETRAINED</text>
  <text x="340" y="412" fill="#ffffff" font-family="Segoe UI, Arial, sans-serif" font-size="28" font-weight="700">DenseNet121</text>
  <text x="340" y="439" fill="#e9fff9" font-family="Segoe UI, Arial, sans-serif" font-size="16">Dense block tái sử dụng đặc trưng</text>
  <g transform="translate(634 370)" fill="none" stroke="#ffffff" stroke-width="3" opacity=".82">
    <circle cx="12" cy="10" r="7"/><circle cx="42" cy="10" r="7"/><circle cx="72" cy="10" r="7"/>
    <circle cx="12" cy="42" r="7"/><circle cx="42" cy="42" r="7"/><circle cx="72" cy="42" r="7"/>
    <path d="M19 10H35 M49 10H65 M12 17V35 M42 17V35 M72 17V35 M19 42H35 M49 42H65 M19 13L36 38 M49 13L66 38"/>
  </g>
  <line x1="731" y1="400" x2="790" y2="400" stroke="#91a2ba" stroke-width="3" marker-end="url(#arrow)"/>
  <rect x="804" y="337" width="230" height="126" rx="18" fill="#ffffff" stroke="#d8e1ee" filter="url(#shadow)"/>
  <text x="919" y="379" text-anchor="middle" fill="#263954" font-family="Segoe UI, Arial, sans-serif" font-size="18" font-weight="700">Classifier mới</text>
  <text x="919" y="410" text-anchor="middle" fill="#66758c" font-family="Segoe UI, Arial, sans-serif" font-size="15">Linear → 37 logits</text>
  <text x="919" y="436" text-anchor="middle" fill="#66758c" font-family="Segoe UI, Arial, sans-serif" font-size="13">Chỉ lớp cuối được train</text>
  <line x1="1042" y1="400" x2="1090" y2="400" stroke="#91a2ba" stroke-width="3" marker-end="url(#arrow)"/>
  <rect x="1104" y="337" width="268" height="126" rx="18" fill="#e6f6f1" stroke="#c9eade"/>
  <text x="1238" y="379" text-anchor="middle" fill="#263954" font-family="Segoe UI, Arial, sans-serif" font-size="18" font-weight="700">Dự đoán</text>
  <text x="1238" y="412" text-anchor="middle" fill="#087e70" font-family="Segoe UI, Arial, sans-serif" font-size="20" font-weight="700">1 trong 37 giống</text>
  <text x="1238" y="437" text-anchor="middle" fill="#66758c" font-family="Segoe UI, Arial, sans-serif" font-size="13">ví dụ: Persian, Beagle…</text>

  <text x="720" y="529" text-anchor="middle" fill="#65748a" font-family="Segoe UI, Arial, sans-serif" font-size="15">Cùng dữ liệu và classifier 37 lớp · khác cách tổ chức và truyền đặc trưng trong backbone</text>
</svg>
